media:
  input: media
  output: /media

content:
  - name: writing
    label: Writing
    type: collection
    path: _posts
    view:
      fields: [title, date, language]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: language
        label: Language
        type: select
        options:
          values: [ko, en]
      - name: music_note
        label: Music Note
        type: rich-text
        description: "Optional commentary about the music"
      -  name: music_url
        label: Music URL
        type: string
        description: "YouTube, SoundCloud, Spotify, or Apple Music link (optional)"
      - name: body
        label: Body
        type: rich-text