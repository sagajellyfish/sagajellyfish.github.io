---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing — AROS</title>

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      line-height: 1.8;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px 120px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 110px;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .logo {
      font-size: 17px;
      letter-spacing: 3px;
    }

    h1 {
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 50px;
    }

    .post {
      display: flex;
      gap: 40px;
      padding: 22px 0;
      border-top: 1px solid #333;
    }

    .date {
      color: #888;
      font-size: 12px;
      min-width: 90px;
    }

    .title {
      font-size: 15px;
    }

    footer {
      margin-top: 100px;
      color: #888;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .post {
        flex-direction: column;
        gap: 5px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <a class="logo" href="/">AROS</a>
      <span>WRITING</span>
    </header>

    <h1>WRITING</h1>

    <main>
      {% for post in site.posts %}
      <div class="post">
        <span class="date">
          {{ post.date | date: "%Y.%m.%d" }}
        </span>

        <a class="title" href="{{ post.url | relative_url }}">
          {{ post.title }}
        </a>
      </div>
      {% endfor %}
    </main>

    <footer>
      <a href="/">← BACK TO HOME</a>
    </footer>

  </div>
</body>
</html>
